# Local Kiwi TCMS dev instance for the Neurex ↔ Kiwi integration.
#
# Isolated from the main docker-compose.yml (own network, volumes, ports) so it
# never collides with the Neurex stack. Based on the official Kiwi compose
# (pub.kiwitcms.eu/kiwitcms/kiwi + MariaDB).
#
# Usage:
#   docker compose -f docker-compose.kiwi.yml up -d
#   # first run only — create DB schema + superuser (interactive password):
#   docker exec -it kiwi_web /Kiwi/manage.py migrate
#   docker exec -it kiwi_web /Kiwi/manage.py createsuperuser
#
# Reach it from:
#   - host / browser:        https://localhost:8643   (self-signed → accept once)
#   - backend in Docker:     https://host.docker.internal:8643
#   Set the Neurex KiwiConnection base_url accordingly and verify_ssl = false.

services:
  kiwi_db:
    container_name: kiwi_db
    image: mariadb:latest
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kiwi-1s-aw3s0m3
      MYSQL_DATABASE: kiwi
      MYSQL_USER: kiwi
      MYSQL_PASSWORD: kiwi
    volumes:
      - kiwi_db_data:/var/lib/mysql
    networks:
      - kiwi_net

  kiwi_web:
    container_name: kiwi_web
    image: pub.kiwitcms.eu/kiwitcms/kiwi:latest
    depends_on:
      - kiwi_db
    restart: unless-stopped
    ports:
      - "8680:8080"   # http
      - "8643:8443"   # https (self-signed)
    environment:
      KIWI_DB_HOST: kiwi_db
      KIWI_DB_PORT: 3306
      KIWI_DB_NAME: kiwi
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: kiwi
    volumes:
      - kiwi_uploads:/Kiwi/uploads:Z
    cap_drop:
      - ALL
    networks:
      - kiwi_net

volumes:
  kiwi_db_data:
  kiwi_uploads:

networks:
  kiwi_net:
    name: kiwi_net
