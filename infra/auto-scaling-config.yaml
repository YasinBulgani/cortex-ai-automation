# ═══════════════════════════════════════════════════════════════════════════════
# Kubernetes Auto-Scaling Configuration
# Horizontal Pod Autoscaler + Vertical Pod Autoscaler + Cluster Autoscaler
# ═══════════════════════════════════════════════════════════════════════════════

---
# ── Backend HPA (Horizontal Pod Autoscaler) ──────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurex-backend-hpa
  namespace: neurex-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurex-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # Scale based on CPU usage
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    # Scale based on memory usage
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Scale based on custom metric (HTTP requests)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

---
# ── Frontend HPA ────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurex-frontend-hpa
  namespace: neurex-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurex-frontend
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

---
# ── Engine HPA ──────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurex-engine-hpa
  namespace: neurex-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurex-engine
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

---
# ── AI Gateway HPA ──────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurex-ai-gateway-hpa
  namespace: neurex-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurex-ai-gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

---
# ── Vertical Pod Autoscaler (VPA) ───────────────────────────────────────────
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: neurex-backend-vpa
  namespace: neurex-production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurex-backend
  updatePolicy:
    updateMode: "Auto"  # Options: "Off", "Initial", "Recreate", "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "neurex-backend"
        minAllowed:
          cpu: 250m
          memory: 128Mi
        maxAllowed:
          cpu: "4"
          memory: 2Gi
        controlledResources: ["cpu", "memory"]

---
# ── Vertical Pod Autoscaler for Frontend ────────────────────────────────────
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: neurex-frontend-vpa
  namespace: neurex-production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurex-frontend
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "neurex-frontend"
        minAllowed:
          cpu: 100m
          memory: 64Mi
        maxAllowed:
          cpu: "2"
          memory: 512Mi

---
# ── Pod Disruption Budget (to maintain availability during scaling) ─────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neurex-backend-pdb
  namespace: neurex-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neurex-backend
  unhealthyPodEvictionPolicy: IfHealthyBudget

---
# ── Pod Disruption Budget for Frontend ──────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neurex-frontend-pdb
  namespace: neurex-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neurex-frontend

---
# ── Pod Disruption Budget for Engine ────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neurex-engine-pdb
  namespace: neurex-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: neurex-engine

---
# ── Cluster Autoscaler Configuration (Deployment) ──────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      serviceAccountName: cluster-autoscaler
      containers:
        - name: cluster-autoscaler
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.27.0
          args:
            - --cloud-provider=aws
            - --aws-region=us-east-1
            - --nodes=1:10:neurex-worker
            - --scale-down-enabled=true
            - --scale-down-delay-after-add=5m
            - --scale-down-delay-after-failure=1m
            - --scale-down-delay-after-delete=10s
            - --scale-down-unneeded-time=10m
            - --balance-similar-node-groups=true
            - --skip-nodes-with-local-storage=false
          env:
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              cpu: 100m
              memory: 300Mi
          volumeMounts:
            - name: ssl-certs
              mountPath: /etc/ssl/certs/ca-certificates.crt
              readOnly: true
      volumes:
        - name: ssl-certs
          hostPath:
            path: /etc/ssl/certs/ca-certificates.crt

---
# ── Cluster Autoscaler Service Account ──────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system

---
# ── Cluster Autoscaler RBAC ────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "replicationcontrollers", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["extensions"]
    resources: ["replicasets", "statefulsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "replicasets", "deployments"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resourceNames: ["cluster-autoscaler"]
    resources: ["leases"]
    verbs: ["get", "update"]

---
# ── Cluster Role Binding ────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

---
# ── Metrics Server (required for HPA) ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      k8s-app: metrics-server
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      serviceAccountName: metrics-server
      containers:
        - name: metrics-server
          image: registry.k8s.io/metrics-server/metrics-server:v0.6.3
          args:
            - --cert-dir=/tmp
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
            - --kubelet-insecure-tls
            - --metric-resolution=15s
          ports:
            - containerPort: 4443
              name: https
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 100m
              memory: 200Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000

---
# ── Metrics Server Service Account ──────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: kube-system

---
# ── Metrics Server RBAC ────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:aggregated-metrics-reader
rules:
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list

---
# ── Metrics Server Cluster Role Binding ─────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:aggregated-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:aggregated-metrics-reader
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
