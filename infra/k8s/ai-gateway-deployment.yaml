# ═══════════════════════════════════════════════════════════════════════════════
# Neurex — AI Gateway (FastAPI, port 8080) Kubernetes Manifests
#
# Provider fallback chain: Ollama (local) → vLLM → Groq → Gemini
# Task-specific routing: ANALYST=qwen2.5:14b, FAST=llama3.1:8b, CODER=qwen2.5-coder:7b
# Auth: GATEWAY_INTERNAL_KEY header zorunludur
# ═══════════════════════════════════════════════════════════════════════════════

---
# ── AI Gateway Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurex-ai-gateway
  namespace: neurex
  labels:
    app: neurex-ai-gateway
    app.kubernetes.io/name: neurex
    tier: ai-gateway
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neurex-ai-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: neurex-ai-gateway
        tier: ai-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ai-gateway
          image: ghcr.io/neurex-ai/neurex-ai-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GATEWAY_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: neurex-secrets
                  key: gateway-internal-key
            - name: REDIS_URL
              value: "redis://neurex-redis:6379/0"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurex-secrets
                  key: groq-api-key
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurex-secrets
                  key: gemini-api-key
            - name: LOG_FORMAT
              value: "json"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://neurex-otel-collector:4317"
            - name: OTEL_SERVICE_NAME
              value: "neurex-ai-gateway"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

---
# ── AI Gateway Service (ClusterIP — internal only) ────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: neurex-ai-gateway
  namespace: neurex
  labels:
    app: neurex-ai-gateway
    app.kubernetes.io/name: neurex
    tier: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: neurex-ai-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http

---
# ── HorizontalPodAutoscaler — AI Gateway ─────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurex-ai-gateway-hpa
  namespace: neurex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurex-ai-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
