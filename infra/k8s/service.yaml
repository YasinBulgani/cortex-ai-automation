apiVersion: v1
kind: Service
metadata:
  name: neurex-api-service
  labels:
    app: neurex
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: neurex-backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: api

---
apiVersion: v1
kind: Service
metadata:
  name: neurex-web-service
  labels:
    app: neurex
    tier: frontend
spec:
  type: NodePort
  selector:
    app: neurex-frontend
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
    name: web

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neurex-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: neurex.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: neurex-api-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: neurex-web-service
            port:
              number: 80
