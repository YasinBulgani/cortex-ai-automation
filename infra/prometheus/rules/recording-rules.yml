# ═══════════════════════════════════════════════════════════════════════════════
# Prometheus Recording Rules - Pre-compute metrics for dashboards
# ═══════════════════════════════════════════════════════════════════════════════

groups:
  # ── API Performance Recording Rules ─────────────────────────────────────
  - name: api_performance
    interval: 1m
    rules:
      # Request rate per service
      - record: service:http_requests:rate1m
        expr: rate(http_requests_total[1m])

      # Request rate per endpoint
      - record: endpoint:http_requests:rate1m
        expr: rate(http_requests_total{endpoint!=""}[1m])

      # Request duration p50
      - record: service:http_request_duration:p50
        expr: histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[1m]))

      # Request duration p95
      - record: service:http_request_duration:p95
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1m]))

      # Request duration p99
      - record: service:http_request_duration:p99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[1m]))

      # Error rate per service
      - record: service:http_request_error:rate1m
        expr: rate(http_requests_total{status=~"5.."}[1m])

      # 4xx error rate
      - record: service:http_request_client_error:rate1m
        expr: rate(http_requests_total{status=~"4.."}[1m])

      # 5xx error rate
      - record: service:http_request_server_error:rate1m
        expr: rate(http_requests_total{status=~"5.."}[1m])

  # ── Database Performance Recording Rules ────────────────────────────────
  - name: database_performance
    interval: 1m
    rules:
      # Query execution time p95
      - record: database:query_duration:p95
        expr: histogram_quantile(0.95, rate(pg_statement_execution_time_seconds_bucket[1m]))

      # Query execution time p99
      - record: database:query_duration:p99
        expr: histogram_quantile(0.99, rate(pg_statement_execution_time_seconds_bucket[1m]))

      # Connection pool utilization
      - record: database:connection_pool:utilization
        expr: pg_stat_activity_count / pg_settings_max_connections

      # Cache hit ratio
      - record: database:cache_hit_ratio
        expr: pg_stat_database_heap_blks_hit / (pg_stat_database_heap_blks_hit + pg_stat_database_heap_blks_read)

      # Slow queries per minute
      - record: database:slow_queries:rate1m
        expr: rate(pg_statement_execution_time_seconds_sum{instance_id=""}[1m])

      # Active connections per database
      - record: database:active_connections
        expr: pg_stat_activity_count

      # Transaction rate
      - record: database:transactions:rate1m
        expr: rate(pg_stat_database_xact_commit[1m]) + rate(pg_stat_database_xact_rollback[1m])

  # ── Cache Performance Recording Rules ──────────────────────────────────
  - name: cache_performance
    interval: 1m
    rules:
      # Cache hit rate
      - record: cache:hit_rate
        expr: (increase(redis_keyspace_hits_total[1m]) / (increase(redis_keyspace_hits_total[1m]) + increase(redis_keyspace_misses_total[1m])))

      # Cache memory usage percent
      - record: cache:memory_usage_percent
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) * 100

      # Cache eviction rate
      - record: cache:evictions:rate1m
        expr: rate(redis_evicted_keys_total[1m])

      # Cache operations per second
      - record: cache:ops:rate1m
        expr: rate(redis_commands_processed_total[1m])

  # ── Application Business Metrics ────────────────────────────────────────
  - name: business_metrics
    interval: 1m
    rules:
      # Active users
      - record: app:active_users
        expr: count(increase(http_requests_total[5m]) > 0)

      # Test execution rate
      - record: app:test_executions:rate1m
        expr: rate(test_executions_total[1m])

      # Test pass rate
      - record: app:test_pass_rate
        expr: rate(test_executions_total{status="passed"}[1m]) / rate(test_executions_total[1m])

      # Average test duration
      - record: app:test_duration:avg
        expr: rate(test_execution_duration_seconds_sum[1m]) / rate(test_execution_duration_seconds_count[1m])

      # Automation suite runs
      - record: app:automation_suite_runs:rate1m
        expr: rate(automation_suite_runs_total[1m])

  # ── Resource Utilization Recording Rules ───────────────────────────────
  - name: resource_utilization
    interval: 1m
    rules:
      # CPU usage percent per node
      - record: node:cpu_usage_percent
        expr: (1 - avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[1m]))) * 100

      # Memory usage percent per node
      - record: node:memory_usage_percent
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100

      # Disk I/O read rate
      - record: node:disk_read_bytes:rate1m
        expr: rate(node_disk_read_bytes_total[1m])

      # Disk I/O write rate
      - record: node:disk_write_bytes:rate1m
        expr: rate(node_disk_written_bytes_total[1m])

      # Network receive rate
      - record: node:network_receive_bytes:rate1m
        expr: rate(node_network_receive_bytes_total[1m])

      # Network transmit rate
      - record: node:network_transmit_bytes:rate1m
        expr: rate(node_network_transmit_bytes_total[1m])

  # ── Availability & Reliability Recording Rules ──────────────────────────
  - name: availability
    interval: 1m
    rules:
      # Service uptime (5m window)
      - record: service:uptime_percent:5m
        expr: (count by (job) (up{job=~"neurex-.*"} == 1) / count by (job) (up{job=~"neurex-.*"})) * 100

      # Service uptime (1h window)
      - record: service:uptime_percent:1h
        expr: (1 - (increase(up{job=~"neurex-.*"}[1h]) - bool (up{job=~"neurex-.*"} == 1)) / increase(up{job=~"neurex-.*"}[1h])) * 100

      # Service uptime (24h window)
      - record: service:uptime_percent:24h
        expr: (1 - (increase(up{job=~"neurex-.*"}[24h]) - bool (up{job=~"neurex-.*"} == 1)) / increase(up{job=~"neurex-.*"}[24h])) * 100
