name: Optimized CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write
  id-token: write
  checks: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  ORG: neurex-ai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 1: VALIDATION & LINT (5-7 min)
  # ────────────────────────────────────────────────────────────────────────────
  validate-and-lint:
    name: Validate & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cache-key: ${{ steps.cache.outputs.key }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Cache Strategy ───────────────────────────────────────────────────
      - name: Restore dependency cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            node_modules
            backend/.venv
          key: deps-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/requirements*.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── Frontend Linting ─────────────────────────────────────────────────
      - name: Frontend ESLint
        run: |
          cd apps/web
          npm ci --prefer-offline --no-audit
          npm run lint -- --format=json --output-file=/tmp/eslint.json || true
          if npm run lint 2>&1 | grep -q "error"; then
            echo "ESLint found errors"
            exit 1
          fi

      # ── Backend Linting ─────────────────────────────────────────────────
      - name: Backend Ruff Lint
        run: |
          pip install ruff==0.4.3
          ruff check backend/ --output-format=json > /tmp/ruff.json || true
          ruff check backend/

      # ── Type Checking (Parallel) ────────────────────────────────────────
      - name: TypeScript Type Check
        run: |
          cd apps/web
          npx tsc --noEmit --pretty false

      # ── Dependency Security Scan ────────────────────────────────────────
      - name: NPM Audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Pip Audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --desc

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 2: UNIT TESTS (10-12 min, parallelized)
  # ────────────────────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-and-lint

    strategy:
      matrix:
        test-suite:
          - backend-core
          - backend-domains
          - engine-core
          - frontend-unit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: matrix.test-suite == 'frontend-unit'
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        if: contains(matrix.test-suite, 'backend') || contains(matrix.test-suite, 'engine')
        with:
          python-version: '3.12'
          cache: 'pip'

      # ── Backend Core Unit Tests ──────────────────────────────────────────
      - name: Backend Core Unit Tests
        if: matrix.test-suite == 'backend-core'
        run: |
          pip install -e backend[test]
          cd backend && pytest tests/unit/ \
            -v --tb=short \
            -m "not integration and not ai and not slow" \
            --cov=app/core \
            --cov-report=xml \
            --cov-report=term-missing \
            --maxfail=5 \
            --timeout=10

      # ── Backend Domains Unit Tests ───────────────────────────────────────
      - name: Backend Domains Unit Tests
        if: matrix.test-suite == 'backend-domains'
        run: |
          pip install -e backend[test]
          cd backend && pytest tests/unit/ \
            -v --tb=short \
            -m "not integration and not ai and not slow" \
            --ignore=tests/unit/test_core \
            --cov=app/domains \
            --cov-report=xml \
            --cov-report=term-missing \
            --maxfail=5 \
            --timeout=10

      # ── Engine Unit Tests ────────────────────────────────────────────────
      - name: Engine Unit Tests
        if: matrix.test-suite == 'engine-core'
        run: |
          pip install -e engine[test]
          cd engine && pytest tests/unit/ \
            -v --tb=short \
            -m "not integration" \
            --cov=core \
            --cov-report=xml \
            --cov-report=term-missing \
            --maxfail=5 \
            --timeout=10

      # ── Frontend Unit Tests ──────────────────────────────────────────────
      - name: Frontend Unit Tests
        if: matrix.test-suite == 'frontend-unit'
        run: |
          cd apps/web
          npm ci --prefer-offline
          npm test -- \
            --coverage \
            --passWithNoTests \
            --maxWorkers=4 \
            --testTimeout=10000

      # ── Upload Coverage ──────────────────────────────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml,./backend/coverage.xml,./engine/coverage.xml
          flags: ${{ matrix.test-suite }}
          name: ${{ matrix.test-suite }}-coverage

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 3: BUILD DOCKER IMAGES (12-15 min with cache)
  # ────────────────────────────────────────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      backends-digest: ${{ steps.build-backend.outputs.digest }}
      frontend-digest: ${{ steps.build-frontend.outputs.digest }}
      engine-digest: ${{ steps.build-engine.outputs.digest }}
      ai-gateway-digest: ${{ steps.build-ai-gateway.outputs.digest }}
      short-sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: image=moby/buildkit:master

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build Backend (Multi-arch, slim) ────────────────────────────────
      - name: Build and push neurex-backend
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-backend:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-backend:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-backend
          cache-to: type=gha,scope=neurex-backend,mode=max
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            VCS_REF=${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.vars.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.short_sha }}
            org.opencontainers.image.version=latest

      # ── Build Frontend (Optimized, slim) ────────────────────────────────
      - name: Build and push neurex-frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-frontend:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-frontend:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-frontend
          cache-to: type=gha,scope=neurex-frontend,mode=max
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            VCS_REF=${{ steps.vars.outputs.short_sha }}

      # ── Build Engine (Parallel) ─────────────────────────────────────────
      - name: Build and push neurex-engine
        id: build-engine
        uses: docker/build-push-action@v6
        with:
          context: ./engine
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-engine:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-engine:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-engine
          cache-to: type=gha,scope=neurex-engine,mode=max

      # ── Build AI Gateway (Parallel) ────────────────────────────────────
      - name: Build and push neurex-ai-gateway
        id: build-ai-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./ai-gateway
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-ai-gateway:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-ai-gateway:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-ai-gateway
          cache-to: type=gha,scope=neurex-ai-gateway,mode=max

      # ── Report Image Sizes ──────────────────────────────────────────────
      - name: Report image sizes
        run: |
          echo "Docker image build completed with cache optimization"
          echo "Frontend: node:20-alpine + multi-stage build (expected: ~200MB)"
          echo "Backend: python:3.12-slim + minimal deps (expected: ~450MB)"
          echo "Engine: base + chrome (expected: ~500MB)"
          echo "AI Gateway: python:3.12-slim (expected: ~350MB)"

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 4: INTEGRATION TESTS (8-10 min, Docker Compose)
  # ────────────────────────────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-and-lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e backend[test]
          pip install -e engine[test]

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          cd backend
          alembic upgrade head

      - name: Backend API contract tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest tests/contract/ \
            -v --tb=short \
            --timeout=30 \
            --maxfail=10 \
            -m "not slow"

      - name: Backend integration tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest tests/integration/ \
            -v --tb=short \
            --timeout=30 \
            --maxfail=10 \
            -m "not slow and not ai"

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 5: SECURITY SCANS (5-7 min, parallel)
  # ────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate-and-lint

    strategy:
      matrix:
        scan:
          - trivy
          - semgrep
          - bandit

    steps:
      - uses: actions/checkout@v4

      # ── Trivy Container Scan ────────────────────────────────────────────
      - name: Run Trivy vulnerability scanner
        if: matrix.scan == 'trivy'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: matrix.scan == 'trivy'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # ── Semgrep SAST ───────────────────────────────────────────────────
      - name: Run Semgrep
        if: matrix.scan == 'semgrep'
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/python

      # ── Bandit Python Security ──────────────────────────────────────────
      - name: Run Bandit
        if: matrix.scan == 'bandit'
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r backend/ engine/ -f json -o bandit-report.json || true

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 6: DEPLOY STAGING (5-10 min)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - validate-and-lint
      - test-unit
      - build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.neurex.ai

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        run: |
          # Pre-deploy verification
          kubectl get nodes -n neurex-staging || echo "Cluster unreachable"

          # Deploy via Helm (recommended for K8s)
          helm repo add neurex-repo ${{ secrets.HELM_REPO_URL }}
          helm repo update
          helm upgrade --install neurex neurex-repo/neurex \
            --namespace neurex-staging \
            --values infra/helm/staging-values.yaml \
            --set image.tag=${{ needs.build-docker.outputs.short-sha }} \
            --timeout 5m \
            --wait --wait-for-jobs

      - name: Smoke test staging
        run: |
          echo "Running staging smoke tests..."
          for i in {1..30}; do
            if curl -sf https://staging.neurex.ai/api/v1/health >/dev/null 2>&1; then
              echo "✓ Staging health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "⚠ Staging health check timeout"
          exit 1

      - name: Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 7: E2E TESTS (10-15 min, staging only)
  # ────────────────────────────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run E2E tests against staging
        env:
          BASE_URL: https://staging.neurex.ai
        run: |
          npm run test:e2e -- \
            --reporter=html \
            --reporter=junit \
            --workers=2

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 8: PRODUCTION DEPLOYMENT (5-10 min)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test-e2e
      - test-integration
      - security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.neurex.ai

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          auto-merge: false
          description: Deployment ${{ github.sha }}

      - name: Configure kubectl
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy with Helm (canary strategy)
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        run: |
          helm repo add neurex-repo ${{ secrets.HELM_REPO_URL }}
          helm repo update
          helm upgrade --install neurex neurex-repo/neurex \
            --namespace neurex-production \
            --values infra/helm/production-values.yaml \
            --set image.tag=${{ needs.build-docker.outputs.short-sha }} \
            --set canary.enabled=true \
            --set canary.weight=10 \
            --timeout 10m \
            --wait

      - name: Health check & traffic ramp-up
        run: |
          for weight in 25 50 75 100; do
            echo "Ramping traffic to ${weight}%"
            kubectl patch -n neurex-production virtualservice/neurex \
              -p "{\"spec\":{\"hosts\":[{\"name\":\"app.neurex.ai\",\"http\":[{\"match\":[],\"route\":[{\"destination\":{\"host\":\"neurex-canary\"},\"weight\":${weight}},{\"destination\":{\"host\":\"neurex-stable\"},\"weight\":$((100-weight))}]}]}]}}" \
              --type merge || true
            sleep 30
          done

      - name: Update deployment status
        if: always()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: ${{ job.status }}
          environment-url: https://app.neurex.ai

      - name: Production smoke test
        run: |
          echo "Running production smoke tests..."
          for i in {1..30}; do
            if curl -sf https://app.neurex.ai/api/v1/health >/dev/null 2>&1; then
              echo "✓ Production health check passed"
              exit 0
            fi
            sleep 10
          done
          exit 1

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 9: ROLLBACK ON FAILURE
  # ────────────────────────────────────────────────────────────────────────────
  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Rollback deployment
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          echo "Rolling back production deployment..."
          helm rollback neurex -n neurex-production --wait

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: 'warning'
          text: 'Production rollback executed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ────────────────────────────────────────────────────────────────────────────
  # Final Report
  # ────────────────────────────────────────────────────────────────────────────
  ci-report:
    name: CI Report
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-and-lint
      - test-unit
      - test-integration
      - build-docker
      - security-scan

    steps:
      - name: Generate CI summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # CI/CD Pipeline Summary

          ## Validation & Lint: ${{ needs.validate-and-lint.result }}
          ## Unit Tests: ${{ needs.test-unit.result }}
          ## Integration Tests: ${{ needs.test-integration.result }}
          ## Docker Build: ${{ needs.build-docker.result }}
          ## Security Scan: ${{ needs.security-scan.result }}

          ### Build Performance
          - Lint & Validation: ~7 min
          - Unit Tests: ~12 min (parallelized)
          - Integration Tests: ~10 min
          - Docker Build: ~15 min (with GHA cache)
          - Total: ~40 min (concurrent stages reduce serial time)

          ### Improvements
          - ✅ GitHub Actions cache for dependencies
          - ✅ Docker layer caching (buildx)
          - ✅ Parallel test execution (4 parallel jobs)
          - ✅ Concurrent security scans
          - ✅ Helm-based K8s deployments
          - ✅ Canary deployment strategy
          - ✅ Automated rollback on failure
          EOF
