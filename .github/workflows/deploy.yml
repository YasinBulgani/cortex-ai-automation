name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  ORG: neurex-ai

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push neurex-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-backend:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-backend:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-backend
          cache-to: type=gha,scope=neurex-backend,mode=max

      - name: Build and push neurex-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-frontend:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-frontend:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-frontend
          cache-to: type=gha,scope=neurex-frontend,mode=max

      - name: Build and push neurex-engine
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-engine:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-engine:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-engine
          cache-to: type=gha,scope=neurex-engine,mode=max

      - name: Build and push neurex-ai-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./ai-gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-ai-gateway:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/neurex-ai-gateway:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=neurex-ai-gateway
          cache-to: type=gha,scope=neurex-ai-gateway,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.neurex.ai

    env:
      ENVIRONMENT: staging
      SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Check KUBECONFIG secret availability
        if: always()
        run: |
          if [ -z "${{ secrets.KUBECONFIG_STAGING }}" ]; then
            echo "WARNING: KUBECONFIG_STAGING secret is not configured."
            echo "Deploy adimi — KUBECONFIG ve cluster erisimi gerekli."
            echo "Lutfen KUBECONFIG_STAGING secret'ini repository ayarlarindan ekleyin."
          else
            echo "KUBECONFIG_STAGING secret mevcut."
          fi

      - name: Set up kubectl
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubeconfig
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy neurex-backend to staging
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        run: |
          kubectl set image deployment/neurex-backend \
            neurex-backend=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-backend:${{ env.SHORT_SHA }} \
            -n neurex-staging
          kubectl rollout status deployment/neurex-backend -n neurex-staging --timeout=5m

      - name: Deploy neurex-frontend to staging
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        run: |
          kubectl set image deployment/neurex-frontend \
            neurex-frontend=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-frontend:${{ env.SHORT_SHA }} \
            -n neurex-staging
          kubectl rollout status deployment/neurex-frontend -n neurex-staging --timeout=5m

      - name: Deploy neurex-engine to staging
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        run: |
          kubectl set image deployment/neurex-engine \
            neurex-engine=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-engine:${{ env.SHORT_SHA }} \
            -n neurex-staging
          kubectl rollout status deployment/neurex-engine -n neurex-staging --timeout=5m

      - name: Deploy neurex-ai-gateway to staging
        if: ${{ secrets.KUBECONFIG_STAGING != '' }}
        run: |
          kubectl set image deployment/neurex-ai-gateway \
            neurex-ai-gateway=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-ai-gateway:${{ env.SHORT_SHA }} \
            -n neurex-staging
          kubectl rollout status deployment/neurex-ai-gateway -n neurex-staging --timeout=5m

  smoke-test:
    name: Staging Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-staging
    environment:
      name: staging

    steps:
      - name: Health check — backend
        run: |
          echo "Running smoke test against staging..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://staging.neurex.ai/api/v1/health || echo "000")
          echo "Backend /health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Backend health check returned $STATUS — staging may not be reachable yet."
            exit 1
          fi

      - name: Health check — frontend
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://staging.neurex.ai/ || echo "000")
          echo "Frontend / status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Frontend health check returned $STATUS."
            exit 1
          fi

      - name: Health check — ai-gateway
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://staging.neurex.ai/api/ai/health || echo "000")
          echo "AI Gateway /health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: AI Gateway health check returned $STATUS."
            exit 1
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke-test
    environment:
      name: production
      url: https://app.neurex.ai

    env:
      ENVIRONMENT: production
      SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Check KUBECONFIG secret availability
        if: always()
        run: |
          if [ -z "${{ secrets.KUBECONFIG_PRODUCTION }}" ]; then
            echo "WARNING: KUBECONFIG_PRODUCTION secret is not configured."
            echo "Deploy adimi — KUBECONFIG ve cluster erisimi gerekli."
          else
            echo "KUBECONFIG_PRODUCTION secret mevcut."
          fi

      - name: Set up kubectl
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubeconfig
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy neurex-backend to production
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        run: |
          kubectl set image deployment/neurex-backend \
            neurex-backend=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-backend:${{ env.SHORT_SHA }} \
            -n neurex-production
          kubectl rollout status deployment/neurex-backend -n neurex-production --timeout=5m

      - name: Deploy neurex-frontend to production
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        run: |
          kubectl set image deployment/neurex-frontend \
            neurex-frontend=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-frontend:${{ env.SHORT_SHA }} \
            -n neurex-production
          kubectl rollout status deployment/neurex-frontend -n neurex-production --timeout=5m

      - name: Deploy neurex-engine to production
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        run: |
          kubectl set image deployment/neurex-engine \
            neurex-engine=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-engine:${{ env.SHORT_SHA }} \
            -n neurex-production
          kubectl rollout status deployment/neurex-engine -n neurex-production --timeout=5m

      - name: Deploy neurex-ai-gateway to production
        if: ${{ secrets.KUBECONFIG_PRODUCTION != '' }}
        run: |
          kubectl set image deployment/neurex-ai-gateway \
            neurex-ai-gateway=${{ env.REGISTRY }}/${{ env.ORG }}/neurex-ai-gateway:${{ env.SHORT_SHA }} \
            -n neurex-production
          kubectl rollout status deployment/neurex-ai-gateway -n neurex-production --timeout=5m
