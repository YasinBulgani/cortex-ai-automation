name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        working-directory: apps/web
        run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        working-directory: apps/web
        run: npm run lint

  test:
    name: Jest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: apps/web
        run: npm test -- --passWithNoTests

  contracts-check:
    name: OpenAPI contracts up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install backend deps
        run: pip install -r backend/requirements.txt --quiet
      - name: Export OpenAPI schema
        run: python backend/scripts/export_openapi.py -o /tmp/openapi.json
      - name: Install node deps
        run: npm ci
      - name: Generate contracts
        working-directory: packages/contracts
        run: npx openapi-typescript /tmp/openapi.json -o ./src/openapi.d.ts
      - name: Check for drift
        run: git diff --exit-code packages/contracts/src/openapi.d.ts || (echo "contracts stale! npm run generate çalıştırın." && exit 1)

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [typecheck]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Next.js build output
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'package-lock.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: apps/web
        run: npm run build
