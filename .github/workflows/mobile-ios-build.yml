name: Mobile iOS Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ios-build.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: 'apps/mobile/ios'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Install Pods
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Run linter
        working-directory: apps/mobile
        run: npm run lint

      - name: Run type check
        working-directory: apps/mobile
        run: npm run type-check

      - name: Run unit tests
        working-directory: apps/mobile
        run: npm run test -- --coverage

      - name: Build iOS app
        working-directory: apps/mobile
        run: npm run build:ios

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: apps/mobile/build
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/mobile/coverage/coverage-final.json
          flags: mobile-ios
          name: mobile-ios-coverage

      - name: Notify deployment
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "iOS build successful. Ready for TestFlight distribution."
