name: Test Automation Pipeline

on:
  push:
    branches: [main, develop, feature/qa-system-bootstrap]
    paths:
      - "backend/**"
      - "apps/web/**"
      - "e2e/**"
      - "engine/**"
      - ".github/workflows/test-automation.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "apps/web/**"
      - "e2e/**"
      - "engine/**"
      - ".github/workflows/test-automation.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Backend + Engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            engine/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r engine/requirements.txt

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m pytest tests/unit/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --tb=short \
            -m "not ai and not slow and not requires_docker"

      - name: Run Engine Unit Tests
        env:
          PYTHONPATH: engine
        working-directory: engine
        run: |
          python -m pytest tests/unit/ \
            -v \
            --tb=short \
            -m "not ai and not integration"

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: warn

  api-tests:
    name: API Tests (FastAPI endpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    strategy:
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run API Contract Tests
        env:
          BASE_URL: http://127.0.0.1:8000
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m pytest tests/contract/ \
            -v \
            --tb=short \
            -m "not ai" || true

  frontend-tests:
    name: Frontend Quality (TypeScript + ESLint + Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: ESLint Check
        working-directory: apps/web
        run: npm run lint

      - name: Jest Unit Tests
        working-directory: apps/web
        run: npm test -- --coverage --passWithNoTests

      - name: Next.js Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend-tests]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Run Playwright E2E Tests
        env:
          BASE_URL: http://127.0.0.1:3000
          CI: "true"
        run: |
          npx playwright test \
            --shard=${{ matrix.shard }}/2 \
            --reporter=html \
            --reporter=junit

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, frontend-tests, e2e-tests]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Generate Test Summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Tests**: ${{ needs.api-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Tests**: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests**: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any required job failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.api-tests.result == 'failure' ||
          needs.frontend-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure'
        run: exit 1
