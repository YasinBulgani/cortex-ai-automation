name: Test Automation Pipeline

on:
  push:
    branches: [main, develop, feature/qa-system-bootstrap]
    paths:
      - "backend/**"
      - "apps/web/**"
      - "e2e/**"
      - "engine/**"
      - ".github/workflows/test-automation.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "apps/web/**"
      - "e2e/**"
      - "engine/**"
      - ".github/workflows/test-automation.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 1: Unit Tests (Fast feedback — ~3 min)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Backend + Engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            engine/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install -r engine/requirements.txt

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m pytest tests/unit/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v \
            --tb=short \
            -m "not ai and not slow and not requires_docker"

      - name: Run Engine Unit Tests
        env:
          PYTHONPATH: engine
        working-directory: engine
        run: |
          python -m pytest tests/unit/ \
            -v \
            --tb=short \
            -m "not ai and not integration"

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Comment PR with Coverage
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const coverage = fs.readFileSync('backend/coverage.xml', 'utf8');
              const match = coverage.match(/line-rate="([\d.]+)"/);
              const rate = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'N/A';
              const comment = `## Backend Coverage\n\n- Line Coverage: **${rate}%**\n\n✅ All unit tests passed`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not parse coverage:', e.message);
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2: API Tests (Service layer — ~5 min)
  # ─────────────────────────────────────────────────────────────────────────────
  api-tests:
    name: API Tests (FastAPI endpoints)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests]
    strategy:
      fail-fast: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Start FastAPI Backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
        shell: bash

      - name: Wait for Backend
        run: |
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; do sleep 1; done'
          echo "Backend is ready"

      - name: Run API Contract Tests
        env:
          BASE_URL: http://127.0.0.1:8000
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m pytest tests/contract/ \
            -v \
            --tb=short \
            -m "not ai"

      - name: Run API Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m pytest tests/integration/ \
            -v \
            --tb=short \
            -m "not ai" \
            --timeout=30 || true

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3: Frontend Tests (TypeScript + ESLint + Jest + Build)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Quality (TypeScript + ESLint + Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: ESLint Check
        working-directory: apps/web
        run: npm run lint

      - name: Jest Unit Tests
        working-directory: apps/web
        run: npm test -- --coverage --passWithNoTests

      - name: Upload Jest Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-${{ github.run_id }}
          path: apps/web/coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Next.js Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 4: E2E Tests (UI automation — ~10 min)
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend-tests]
    strategy:
      fail-fast: false
      matrix:
        # Run E2E tests in parallel by shard
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Start FastAPI Backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
        shell: bash

      - name: Wait for Backend
        run: |
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; do sleep 1; done'
          echo "Backend is ready"

      - name: Build Frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Start Frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"
          PORT: "3000"
        run: npm run start &
        shell: bash

      - name: Wait for Frontend
        run: |
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:3000 >/dev/null 2>&1; do sleep 2; done'
          echo "Frontend is ready"

      - name: Run Playwright E2E Tests
        env:
          BASE_URL: http://127.0.0.1:3000
          CI: "true"
        run: |
          npx playwright test \
            --shard=${{ matrix.shard }}/2 \
            --reporter=html \
            --reporter=junit

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 5: Smoke Tests (Quick sanity check — ~3 min)
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (Quick sanity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Backend Smoke Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENVIRONMENT: test
          PYTHONPATH: backend
        working-directory: backend
        run: |
          python -m pytest tests/ -m smoke -v --tb=short || true

  # ─────────────────────────────────────────────────────────────────────────────
  # FINAL: Test Summary & Notifications
  # ─────────────────────────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, frontend-tests, e2e-tests]
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download All Test Artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts/
        continue-on-error: true

      - name: Generate Test Summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Tests**: ${{ needs.api-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Tests**: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests**: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports available for download" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright HTML reports available" >> $GITHUB_STEP_SUMMARY
          echo "- Test result XMLs available" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on Failure
        if: failure() && github.event_name == 'push'
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "🔴 Test Pipeline Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test Pipeline Failed* 🔴\n*Branch:* `${{ github.ref_name }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Unit Tests*\n${{ needs.unit-tests.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*API Tests*\n${{ needs.api-tests.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Frontend Tests*\n${{ needs.frontend-tests.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*E2E Tests*\n${{ needs.e2e-tests.result }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Notify Slack on Success
        if: success() && github.event_name == 'push'
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "✅ Test Pipeline Passed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Test Pipeline Passed* ✅\n*Branch:* `${{ github.ref_name }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  }
                }
              ]
            }

      - name: Fail if any required job failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.api-tests.result == 'failure' ||
          needs.frontend-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure'
        run: exit 1
