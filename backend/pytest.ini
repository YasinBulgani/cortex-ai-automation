[pytest]
pythonpath = . ..
# `tests/` ana test suite; `app/domains/agents/v2/tests/` domain-local
# birim testleri içerir (Gherkin parser, AI gateway, locator pipeline, run
# store). Testpaths'e eklenmeden pytest onları hiç keşfetmiyordu.
testpaths =
    tests
    app/domains/agents/v2/tests
filterwarnings =
    ignore::DeprecationWarning

asyncio_mode = auto

addopts =
    --tb=short
    -v
    --strict-markers
    --cov=app
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=70

markers =
    asyncio: pytest-asyncio async tests (playwright_mcp, async service calls)
    smoke: Hızlı sağlık kontrolü testleri (health, ready, auth temel)
    service: API servis katmanı testleri (CRUD, validasyon)
    regression: Regresyon testleri (schema, dataset, version)
    integration: Entegrasyon testleri (DB + seed gerektiren)
    slow: Yavaş testler (AI, büyük dataset — >5s)
    ai: LLM çağrısı yapan testler (ücret üretir — OPENAI_API_KEY gerektirir)
    requires_db: PostgreSQL gerektirir (integration altkümesi)
    requires_redis: Redis gerektirir (cache/rate-limit testleri)
    flaky: Flaky olarak işaretlenmiş — karantinada (tspm.flaky servisi takip eder)
    security: Güvenlik testleri (RLS, JWT, injection, tenant boundary)
    P0: Blokleyici öncelik
    P1: Kritik öncelik
    P2: Normal öncelik
    P3: Düşük öncelik
    critical: BDD kritik senaryo tag'i
    high: BDD yüksek öncelik tag'i
    medium: BDD orta öncelik tag'i
    boundary: BDD sınır-değer tag'i
    pozitif: BDD pozitif senaryo tag'i
    negatif: BDD negatif senaryo tag'i
    TC-AUTH-001: Auth BDD test case 1
    TC-AUTH-002: Auth BDD test case 2
    TC-AUTH-003: Auth BDD test case 3
    TC-AUTH-004: Auth BDD test case 4
    TC-AUTH-005: Auth BDD test case 5
    TC-AUTH-006: Auth BDD test case 6
    TC-AUTH-007: Auth BDD test case 7
    TC-PRJ-001: Project BDD test case 1
    TC-PRJ-002: Project BDD test case 2
    TC-PRJ-003: Project BDD test case 3
    TC-PRJ-004: Project BDD test case 4
    TC-SCN-001: Scenario BDD test case 1
    TC-SCN-002: Scenario BDD test case 2
    TC-SCN-003: Scenario BDD test case 3
    TC-SCN-004: Scenario BDD test case 4
    TC-SCN-008: Scenario BDD test case 8
    TC-SCN-009: Scenario BDD test case 9
